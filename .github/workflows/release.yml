name: Release ISO

# 手动触发: 从指定 CI run 下载 auraos-iso artifact, 以 Release 形式发布。
# runner 内网下载 artifact 远快于本地跨墙拉 2.7GB。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run ID (Build AURA-OS ISO) to publish'
        required: true
      tag:
        description: 'Release tag, e.g. v1.0'
        required: true
      notes:
        description: 'Release notes (markdown)'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Download ISO artifact
        run: gh run download -R "$GITHUB_REPOSITORY" "$RUN_ID" -n auraos-iso -D out
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}

      - name: Checksums
        run: |
          cd out
          sha256sum *.iso > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: Create release
        run: |
          gh release create -R "$GITHUB_REPOSITORY" "$TAG" out/*.iso out/SHA256SUMS.txt \
            --title "AURA-OS $TAG" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
