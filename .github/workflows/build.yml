name: Build AURA-OS

# Pure-NASM kernel: assemble flat-binary image, then boot it headless in QEMU
# and assert the "[aura] ready" serial marker (tests/smoke.sh).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 python3-pil

      - name: Build image
        run: make

      - name: Smoke test (headless QEMU)
        run: make smoke

      - name: Show artifacts
        run: ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: auraos-img
          path: out/auraos.img
          retention-days: 14
